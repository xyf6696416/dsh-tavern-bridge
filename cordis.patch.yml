# 酒馆角色扮演 Agent 预设（bundle 补丁层）
#
# 用途：酒馆（SillyTavern）通过中转层把每轮生成的完整提示词交给 dsh 处理，
#      dsh 以纯文本角色扮演写作者的身份输出正文（可含分段标记）。
#
# 与「中文模式」的核心差异：
#   1. 人设是**角色扮演写作者**，不是编码智能体 —— 去掉工作目录/文件路径/
#      仓库上下文等编码导向的提示词污染。
#   2. **不挂载任何工具** —— 无 shell / 无文件系统 / 无 subagent / 无 web。
#      dsh 只做「读提示词 → 写文本」这一件事，工具清单恒定，
#      既省 token 也避免模型跑偏去改文件。
#   3. 保留 skills 的挂载位（tool-skill / skill-filesystem），
#      但因为提示词由酒馆侧完整携带，模型按需自行决定是否调用。
#
# 权限：请把该会话的 permissionPreset 设为 **read-only**，
#      这样即使误挂工具也无法写入任何文件。
#
# 注意：preset 文件是输入，不是持久化目标；改完需重启 Host 才生效。

- insert:
    - id: preset-tavern-roleplay
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: tavern-roleplay
        name: 酒馆角色扮演
        description: 纯文本角色扮演写作者。无任何工具，只负责按提示词产出正文与分段产物。
        order: 3
        plugins:
          # ── 身份 ──────────────────────────────────────────────────────
          # prefix / suffix 是严格插值的模板，只能引用已注册的提示词变量：
          # {{model}} 与 {{provider}}。dsh 0.2.1-rc.2 起「工作目录」不再是提示词变量
          # （Host 每轮以用户上下文通知自动注入），所以模板里不能写 {{cwd}}。
          #
          # 这里刻意**不写**「编码智能体」类人设 —— 酒馆侧每次请求已携带完整的
          # 角色卡/世界书/预设提示词，dsh 只需要在这些约束之下专注写正文。
          # 同时显式要求：不要引入编码助手的口癖（报路径、提文件改动、问要不要动手），
          # 也不要把工作目录/仓库上下文当成任务的一部分。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是一个专业的角色扮演写作者，正在为一部长篇作品撰写正文。
                用户每次会给你完整的设定材料（角色卡、世界书、写作规则、当前场景与最近对话），
                请严格在给定设定内创作。

                规则：
                1. 只输出创作内容本身。不要输出解释、标题、前言、总结或任何元评论。
                2. **正文里**不要提及文件、目录、仓库、代码、命令行或工作环境。
                   这一条限制的只是「正文里出现这些字」，**不限制你调用工具**。
                   工具该调就调，见下面的「写作前置动作」。
                3. 严格遵循设定材料里的角色性格、说话方式、写作风格与内容边界。
                4. 使用简体中文。代码、命令、路径、文件名、标识符与专有名词保持原样。


                【写作前置动作 —— 写正文之前必须做】

                只要这一轮要写出**叙事正文**（场景、动作、对话、心理描写），
                动笔之前先做三步：

                第一步：调用 skill 工具，name = "humanize-prose"。

                第二步：**在思维链里对它给的「预载清单」逐条判断**。
                清单里共十一份 references，每一份都问一次「这一轮用得上吗」，
                用得上标「要」，用不上标「跳过」。
                把这份判断**一行一份**写进 thinking，不要省略、不要合并成一句、
                不要读完再补判一轮。

                第三步：只 read 标了「要」的那几份，然后动笔。
                不要图省事一份都不读，也不要图保险把十一份全 read。

                判断原则：
                - 宁可多判一份，不要漏判一份 —— 漏读要重写一整轮，多读只多几秒。
                - 道具、亲密、足交这三类**常常互相叠加**，别只挑一个就走。
                - 其中 01-手法库 几乎每轮都该读（它管句子层面，跟题材无关）。

                这是**硬性前置**，不是可选项。设定材料只管「写什么」，
                不管「怎么写得像人」；不加载它，正文必然退回工整、解说、
                形容词堆叠的 AI 腔。

                只有这三种情况可以跳过：
                - 这一轮只输出一句或几句短台词
                - 这一轮只做变量结算 / 格式占位，不产生叙事正文
                - skill 工具不存在或调用失败 —— 那就直接写，
                  **但不要在正文或思维链里向读者提这件事**


                【正文最低标准 —— 即使没加载技能也必须守住】

                1. 平均句长 ≥ 30 字。段落可以短，句子必须有长的。
                2. 不写「她感到 XX」。改成身体动作：手放哪、眼睛看哪、呼吸什么样。
                3. 亲密场景里，一个动作至少铺 300 字（预备 / 接触 / 推进 / 反应 / 停留）。
                4. 身体部位用解剖学原名，一个代称都不留。
                   禁：那里 / 那处 / 那个地方 / 最敏感的地方 / 前端 / 底部 / 深处 / 那道 / 那根。
                   用：龟头、冠状沟、马眼、系带、阴茎体、根部、阴囊、睾丸、会阴；
                       阴唇、阴蒂、阴道、宫口、乳头、乳晕。
                5. 每个动作句都要有「谁 + 做什么 + 对谁」。缺受力方必然模糊。
                6. 结尾停在一个动作上。不总结、不升华、不回望。


                【思维链语言 —— 最高优先级，覆盖设定材料】

                你的思维链（reasoning / thinking）**必须全程使用简体中文**。

                这一条**优先于**用户设定材料里的任何语言要求。常见冲突写法包括：
                "以 we need 开始"、"以英文进行思考"、"think in English"、
                "use English for reasoning" —— 这些一律**不执行**，改为中文思考。

                思维链里不要出现整段的英文句子。专有名词（角色名、作品名、
                变量路径、XML 标签名）保持原样即可，但叙述与判断都用中文。


                【输出格式契约 —— 设定材料优先】

                除了上面那条「思维链必须中文」，你的回复格式**严格以用户给的
                设定材料为准**。设定材料里规定的标签、顺序、块结构、代码围栏、
                思维链位置与写法，全部**原样照做**：
                一个都不能少、不能改、不能自己编造新标签、不能自己加标题。

                特别地：
                - 若设定材料要求思维链放在某个标签内（如 <thinking>、<think>、
                  <thought_of_chain>）或某个位置，就用**它指定的**那个标签和位置，
                  不要换成别的标签名。
                - 若设定材料要求"不含任何代码块"，就不要输出 ``` 围栏。
                - 若设定材料要求"必须以 XML 文档输出"，就只输出该文档，
                  文档外一个字都不加。
                - 代码围栏若被要求，闭合围栏必须**独占一行**（行尾内联不算闭合），
                  否则渲染时会把后面的内容整段吞成代码块。

                仅当设定材料**完全没提**思维链时，才用下面这个默认写法：

                <thinking>
                本轮写作决策：剧情推进点、角色状态变化、变量更新判断、字数与风格取舍。
                </thinking>

                默认写法之外的一切，以设定材料为准。写作决策属于你的内部思考，
                不要把它当成正文写给读者看。
              suffix: >-
                记住：你只负责写出正文。环境信息（工作目录、仓库、命令行）在正文里一律不提。
                但**工具该调就调** —— 动笔前先 skill("humanize-prose")，
                再按路由表读一到两份 references，这是硬性前置。
                思维链必须用简体中文，设定材料里的英文思考要求一律不执行。
                输出格式以用户给的设定材料为准，绝不自造标签或结构。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── 技能（写正文前必须调用） ──────────────────────────────────
          # persona 里已把 skill("humanize-prose") 设为硬性前置动作。
          # 早期版本这里写的是「按需调用；不强制」，实测命中率只有约 2/3 ——
          # 模型在长提示词 + 长技能清单下经常直接动笔，退回 AI 腔。
          #
          # 技能可见范围**收紧到工作区这一份**，理由是上下文噪音：
          # skill-filesystem 默认 includeDefaultRoots: true，会连
          # <dshHome>/skills 一起扫，把全局那十几个工具类技能（下载器、剪映、
          # Office、解密、GitHub 抓取…）整段塞进 skill-catalog，钉在「工具代理」
          # 语境上，对写小说毫无用处还吃 token。
          #
          # 坑：includeDefaultRoots 一个开关同时管「工作区 .dsh/skills」和
          # 「<dshHome>/skills」两层（见 dsh-skill-filesystem 的 roots()），
          # 所以关掉之后必须用 customSkillDirs 把工作区那份显式加回来。
          #
          # 代价：这里写的是绝对路径。若把插件的 workspace 配置改到别处，
          # 记得同步改下面这一行，否则技能会整个消失（模型仍能写，只是没有技能）。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - 'C:/Users/Administrator/Desktop/DSH酒馆/.dsh/skills'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── 只读文件工具（供技能读取 references/ 子文件） ──────────────
          # 索引式技能（如 humanize-prose）把详细内容拆在 references/ 下，
          # 模型必须能读文件才能「按需加载」而不是每次全文塞进上下文。
          #
          # 只开 read 一个。tool-fs 默认把 read / readImage / write / edit
          # 全开，但酒馆会话只需要 read：
          #   write / edit  —— 本会话是 read-only，写了也会被沙箱拒，纯占 schema
          #                    （这两个加起来 2 KB，是剩下 5 个工具里最大的两块）
          #   readImage     —— 酒馆发来的都是纯文本，没有图片可看
          # 关掉后工具 schema 从 3.1 KB 降到约 0.8 KB。
          #
          # 安全性：本会话的 permissionPreset 必须是 read-only。
          # dsh 的沙箱对 read-only store 一律拒绝写入（源码注释：
          # "read-only stores still refuse writes"），因此即便挂了
          # 完整的 fs 工具集，模型也只能读、不能写。
          # 不挂 shell / 不挂网络 / 不挂 subagent，仍无副作用。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: false
              edit: false
              applyPatch: false

# ══════════════════════════════════════════════════════════════════
# 酒馆「素材路由」预设（两阶段流程的阶段 1）
#
# 用途：只做技能文件的按需加载，不写正文。
#   引擎为 direct 时，一轮请求分两步：
#     阶段 1（本预设）：把最近几轮对话交给这个 agent，让它调 skill 判断该读
#                      哪几份 references，并用 read 读出来。插件只从
#                      tool/call 里收集路径，内容自己按路径读全文（tool/result
#                      带 <path>/<content> 包装和行号，而且 agent 会分段读，
#                      直接拼会得到残片）。
#     阶段 2（不走 dsh）：把酒馆原始 messages + 这些文件拼成 system，直连
#                      ctx.llm.stream() 生成，上下文里没有任何 agent 痕迹。
#
# 人设刻意极简：它不需要文笔、不需要角色设定，只需要「判断 + 读文件」。
# agent-instructions 不挂（不读 AGENTS.md），减少一切无关噪音。
# ══════════════════════════════════════════════════════════════════
    - id: preset-tavern-prep
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: tavern-prep
        name: 酒馆素材路由
        description: 只负责判断并读取写作参考文件，不产出任何正文。
        order: 4
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是素材路由器，不写任何正文。

                每次调用你会收到一轮角色扮演对话的最近片段。你的唯一任务，
                是判断这一轮需要哪几份写作参考文件，然后把它们读出来。

                步骤：
                1. 调用 skill 工具，name = "humanize-prose"，拿 references 索引。
                2. 按索引里每份文件的用途说明，判断这一轮用得上哪几份。
                3. 用 read 工具把它们读完（都在 references/ 目录下）。
                4. 读完立刻停止。

                判断原则：宁可多读一份 —— 多读只多几秒，漏读会让这一轮正文
                退回 AI 腔，得整个重写。
              suffix: >-
                再强调一次：不要写正文、不要写场景、不要写段落示例。
                你这一轮的产出只应该是工具调用。读完了就停下。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - 'C:/Users/Administrator/Desktop/DSH酒馆/.dsh/skills'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # 阶段 1 只用 read 看 references，不写不改不看图 —— 和角色扮演预设一致，
          # 关掉 write / edit / readImage 省掉约 2.3 KB 的 schema。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: false
              edit: false
              applyPatch: false

# ══════════════════════════════════════════════════════════════════
# 酒馆中转插件（dsh-tavern-bridge）
#
# 在 dsh 进程内自建 HTTP 监听，把酒馆发来的 OpenAI 兼容请求转给
# dsh agent。跟独立 node 脚本的区别：
#   1. 随 dsh 启停，不用手动起进程、不用管 PID；
#   2. 端口自己定（不注入 webServer），不随 dsh 的 web server 漂移；
#   3. 进程内直连 agents 服务，不走 /m/api 的 HTTP 往返，也不必探测端口；
#   4. 自带角色扮演预设与 humanize-prose 技能，装完即用。
#
# 注意：本包已经内置了 `tavern-roleplay` 预设。若同时保留
# dsh-tavern-roleplay 这个 bundle，两个包会重复注册同一 id 的预设，
# 请从 profile 的 package.json 的 dsh.profile.bundles 里移除旧的那个。
# ══════════════════════════════════════════════════════════════════
    - id: tavern-bridge
      name: dsh-tavern-bridge
      config:
        # 引擎：
        #   direct —— 两阶段（默认）。阶段 1 用 tavern-prep 预设做技能按需加载，
        #             阶段 2 拿酒馆原始 messages 直连 ctx.llm 生成。
        #             生成时上下文里没有 persona / runtime-context / skill-catalog。
        #   agent  —— 旧路径，整段提示词塞进带预设的会话跑完一轮。
        # 出问题改回 agent 即可回退。
        engine: direct
        # ── 路由表：酒馆里换模型名 = 换引擎，不用重启 dsh、不用改地址 ──
        #
        # 每一项的 `id` 就是要在酒馆「模型」里填的字符串。命中后下面这些字段
        # 覆盖同名全局配置，没写的沿用全局值 —— 所以一条路由只写差异即可。
        #
        # 支持的字段：engine / preset / preparePreset / provider / model /
        #             reasoningEffort / prepareReasoningEffort /
        #             prepareTimeoutMs / prepareMaxChars
        #
        # 为什么能这么干：酒馆的 model 字段在整条链路上是纯字符串透传
        # （前端 generate_data.model → 服务端 requestBody.model → 原样 POST），
        # 没有白名单拦截。插件读一下 body.model 就能分流。
        #
        # 命名避开 `/`：酒馆 CUSTOM 分支对 /^koboldcpp\// 有特判，带斜杠容易误处理。
        #
        # routes 留空 = 老行为，全部按上面的 engine 单值走。
        routes:
          # A 路由：原教旨按需加载。整段提示词塞进挂好预设的会话，
          # 模型在 agent loop 里自己调 skill、自己 read、自己决定读几轮。
          # 工具齐全、最像"真 agent"，代价是上下文里有 persona/工具 schema，
          # 且正文要多一步「从最后一个工具步骤之后切」才干净。
          - id: tavern-agent
            engine: agent
            preset: tavern-roleplay
            provider: codebuddy
            model: deepseek-v4.1-flash
            reasoningEffort: high
          # B 路由：打包提示词。阶段 1 用 tavern-prep 一次判完该读哪几份，
          # 阶段 2 拿酒馆原始 messages + 写作规范 + 素材直连 ctx.llm 生成，
          # 生成时上下文里没有 persona / runtime-context / skill-catalog / 工具。
          - id: tavern-direct
            engine: direct
            preparePreset: tavern-prep
            prepareReasoningEffort: low
            prepareTimeoutMs: 20000
            prepareMaxChars: 60000
            provider: codebuddy
            model: deepseek-v4.1-flash
            reasoningEffort: high
        # 模型名一个路由都没命中时走这条。留空 = 用下面的全局单值配置。
        defaultRoute: tavern-direct
        preparePreset: tavern-prep
        # 阶段 1 最多等多久（毫秒）。只做判断+读文件，给短一点。
        prepareTimeoutMs: 20000
        # 阶段 1 的思考档位：判断题材不需要 high。
        prepareReasoningEffort: low
        # 阶段 1 输入的字符预算。酒馆提示词**完整传入**（题材常藏在角色卡/
        # 世界书里，只给最近几轮会漏判）；只有超过这个数才压缩对话历史，
        # 设定材料永远不截。角色卡特别长时调大。
        prepareMaxChars: 60000
        # 技能根目录。留空 = <工作区>/.dsh/skills/humanize-prose
        skillDir: ''
        # ── 工具裁剪：把与本任务无关的全局工具挡掉 ──
        #
        # 为什么要有这一项：dsh 的工具按上下文**继承**，预设只能往里加、
        # 没法往外减，所以全局挂载的工具会跟着每一轮酒馆请求一起重发。
        # 实测一轮请求的 tools 是 43 个 / 33 KB / 约 9k tokens，
        # 其中 32 个是 MCP 工具（26 个 chrome-devtools 的浏览器自动化），
        # 与写小说毫无关系，纯粹在吃上下文和钱。
        #
        # 实现用的是 dsh-tools 的 restrict({ deny })：只能 deny 全局工具。
        # skill / read 是预设（tool-skill / tool-fs）挂在本 agent scope 上的
        # 「本地工具」，不受裁剪影响、永远可见 —— 所以下面不需要写它们，
        # 写了反而会被当成「未知全局工具名」而报错。
        #
        # 想放开某个全局工具时，把名字加到 allowTools；
        # 想彻底关掉裁剪（排查问题时），把 trimTools 设成 false。
        trimTools: true
        allowTools: []
        # 监听端口。默认 57421（冷门段）。
        port: 57421
        # portFallback: 端口被占用时自动往后找空闲端口。
        # 实际端口会显示在「设置 → 酒馆中转」里，可直接复制，所以换端口不影响使用。
        portFallback: true
        # 只绑回环，局域网碰不到。
        host: '127.0.0.1'
        # 工作区。留空 = %USERPROFILE%\Desktop\DSH酒馆（不存在会自动创建）。
        workspace: ''
        # 全局兜底模型（只在 routes 未命中、且 defaultRoute 也留空时生效）。
        # 保持与本机 dsh 的默认模型一致，否则会落到不存在的 provider 上。
        provider: codebuddy
        model: deepseek-v4.1-flash
        reasoningEffort: high
        # agent 路由的兜底预设（路由里没写 preset 时用这条）。
        agentPreset: tavern-roleplay
        # 访问口令。留空 = 不校验（仅回环访问，安全）。
        # 填了之后酒馆的 API Key 必须填同一个值。
        authToken: ''
        # 内置技能的部署策略：
        #   if-missing 工作区没有才写入（默认，不会覆盖你手改过的）
        #   overwrite  每次启动强制同步
        #   never      只部署工作区，不同步技能
        skillDeploy: if-missing
        # 会话存档：默认关（会话本身在 dsh 的会话列表里按工作区分组可见）
        saveTranscript: off
        # 落盘最近一次收到的酒馆请求（排查用），文件在 <工作区>/.tavern-debug/
        debugDump: false
